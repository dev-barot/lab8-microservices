apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: lab8
  labels:
    app.kubernetes.io/part-of: lab8-microservices
type: Opaque
stringData:
  # Replace with your MongoDB Atlas connection string if using Atlas:
  # e.g., mongodb+srv://<username>:<password>@cluster0.mongodb.net/user_db?retryWrites=true&w=majority
  # Default falls back to in-cluster mongodb service
  MONGO_URI_USER: "mongodb://mongodb-service:27017/user_db"
  MONGO_URI_PRODUCT: "mongodb://mongodb-service:27017/product_db"
  MONGO_URI_ORDER: "mongodb://mongodb-service:27017/order_db"

