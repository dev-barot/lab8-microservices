apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: lab8
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'gateway'
        metrics_path: /metrics
        scrape_interval: 3s
        static_configs:
          - targets: ['gateway-service.lab8.svc.cluster.local:8080', 'gateway-service:8080']

